name: Sestavení AntFan.exe

# Spouští se:
#  - ručně (Actions → Sestavení AntFan.exe → Run workflow) → exe ke stažení v Artifacts
#  - značkou verze, např. `git tag v1.0.0 && git push --tags` → exe přiložené k Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Závislosti
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.11.1

      - name: Sestavení
        run: >
          pyinstaller --noconfirm --onefile --windowed --name AntFan
          --collect-all libusb_package --collect-submodules openant
          AntFan.pyw

      - name: Kontrola exe (selftest)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AntFan.exe -ArgumentList '--selftest','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Selftest selhal (kód $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: AntFan-exe
          path: dist/AntFan.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AntFan.exe
          generate_release_notes: true
